[project]
name = "ilc-provider"
version = "0.1.3"
description = "Faker provider for ILC data models"
readme = "README.md"
authors = [
    { name = "Neil Martin", email = "neil@fourtrees.tech" }
]
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "faker>=37.0.2",
    "ilc-models>=0.3.1",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Repository = "https://github.com/fourtreestech/ilc-provider"
Documentation = "https://ilc-provider.readthedocs.io/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.bumpver]
current_version = "0.1.3"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message = "Bump version {old_version} -> {new_version}"
tag_message = "{new_version}"
tag_scope = "default"
pre_commit_hook = ""
post_commit_hook = ""
commit = true
tag = false
push = false

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'version = "{version}"',
]
"README.md" = [
    'version-{version}-blue',
]
"src/ilc_provider/__init__.py" = [
    '__version__ = "{version}"'
]
"docs/source/conf.py" = [
    'release = "{version}"'
]

[tool.cov-badge]
percent_path = ["totals", "percent_covered_display"]

[tool.tox]
requires = ["tox>=4.24", "tox-uv>=1.37.0"]
env_list = ["3.14", "3.13", "3.12", "lowest", "highest"]

[tool.tox.env_run_base]
description = "Run tests under {base_python}"
runner = "uv-venv-lock-runner"
package = "editable"
dependency_groups = ["test"]
commands = [["pytest"]]

[tool.tox.env.lowest]
description = "Run tests under {base_python} with lowest dependency versions"
runner = "uv-venv-runner"
base_python = ["python3.12"]
skip_install = true
dependency_groups = []
allowlist_externals = ["uv"]
commands_pre = [["uv", "pip", "install", "--resolution", "lowest", "-e", ".", "--group", "pyproject.toml:test"]]

[tool.tox.env.highest]
description = "Run tests under {base_python} with highest dependency versions"
runner = "uv-venv-runner"
base_python = ["python3.14"]
skip_install = true
dependency_groups = []
allowlist_externals = ["uv"]
commands_pre = [["uv", "pip", "install", "--resolution", "highest", "--upgrade", "-e", ".", "--group", "pyproject.toml:test"]]

[tool.uv]
default-groups = ["dev", "test"]

[dependency-groups]
dev = [
    "cov-badge>=0.1.1",
    "sphinx>=8.2.3",
    "sphinx-rtd-theme>=3.0.2",
]
test = [
    "pytest>=8.3.5",
    "pytest-cov>=6.0.0",
    "pytest-randomly>=3.16.0",
]
docs = [
    "sphinx>=8.2.3",
    "sphinx-rtd-theme>=3.0.2",
]